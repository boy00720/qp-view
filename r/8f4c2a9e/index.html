<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    margin-bottom: 14px;

  p { font-size: 12.5px; color: #94a3b8; line-height: 1.55; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
  .input-row { display: flex; gap: 8px; }
  input[type="password"], input[type="text"] {
    flex: 1;
    background: #0f1115;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    outline: none;
  }
  input:focus { border-color: #3b82f6; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-toggle {
    background: #1e232d;
    color: #cbd5e1;
    border: 1px solid #334155;
    padding: 0 11px;
    font-size: 12px;
  }
  .btn-submit {
    width: 100%;
    margin-top: 12px;
    background: #3b82f6;
    color: #fff;
  }
  .btn-submit:disabled { opacity: 0.6; cursor: wait; }
  .err {
    margin-top: 12px;
    font-size: 12.5px;
    color: #f87171;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 8px;
    padding: 8px 10px;
    display: none;
  }
  .foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #242b38;
    font-size: 11px;
    color: #64748b;
    line-height: 1.5;
  }

<script>
(function() {
  const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const payload = JSON.parse(document.getElementById("enc-payload").textContent);
  const form = document.getElementById("unlockForm");
  const pwInput = document.getElementById("pw");
  const toggleBtn = document.getElementById("togglePw");
  const submitBtn = document.getElementById("submitBtn");
  const errBox = document.getElementById("errBox");

  toggleBtn.addEventListener("click", () => {
    const isPw = pwInput.type === "password";
    pwInput.type = isPw ? "text" : "password";
    toggleBtn.textContent = isPw ? "隱藏" : "顯示";
  });

  async function decryptWith(password) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("NO_SUBTLE");
    }
    const enc = new TextEncoder();
    const keyMat = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(payload.salt), iterations: payload.iter, hash: "SHA-256" },
      keyMat,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
      key,
      b64ToBytes(payload.ct)
    );
    return new TextDecoder().decode(plainBuf);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "解密中...";
    try {
      const html = await decryptWith(pwInput.value.trim());
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      errBox.textContent = err && err.message === "NO_SUBTLE"
        ? "目前瀏覽器環境不支援 Web Crypto（請使用 HTTPS 網址或本機檔案直接開啟）。"
        : "密碼錯誤，無法解密內容，請重新確認。";
      errBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "解鎖檢視報表";
      pwInput.select();
    }
  });
})();
</script>
